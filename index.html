<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0D2029"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Screening"/>
  <meta name="description" content="Private-first factory engagement intelligence, screening and source tracking."/>
  <meta name="referrer" content="no-referrer"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"/>
  <link rel="icon" href="./favicon.png?v=4" type="image/png" sizes="48x48"/>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml"/>
  <link rel="shortcut icon" href="./favicon.png?v=4" type="image/png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/ScreeningTool/apple-touch-icon-screening-v4.png"/>
  <link rel="manifest" href="./manifest.webmanifest?v=4"/>
  <link rel="stylesheet" href="./styles.css"/>
  <title>Screening Atlas · Private Factory Intelligence</title>
</head>
<body>
<svg class="svg-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
 <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
 <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></symbol>
 <symbol id="icon-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5.2" rx="8.4" ry="3.3"/><path d="M3.6 5.2v13.6c0 1.8 3.8 3.3 8.4 3.3s8.4-1.5 8.4-3.3V5.2M3.6 11.8c0 1.8 3.8 3.3 8.4 3.3s8.4-1.5 8.4-3.3"/></symbol>
 <symbol id="icon-shield" viewBox="0 0 24 24"><path d="m12 2 8 3v6c0 5.3-3.2 9-8 11-4.8-2-8-5.7-8-11V5z"/><path d="m8 12 3 3 5-6"/></symbol>
 <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V3m0 0L7 8m5-5 5 5"/><path d="M4 16v4h16v-4"/></symbol>
 <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
 <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
 <symbol id="icon-close" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
 <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
 <symbol id="icon-alert" viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3Z"/><path d="M12 9v5m0 3h.01"/></symbol>
 <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="12" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
 <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></symbol>
 <symbol id="icon-layers" viewBox="0 0 24 24"><path d="m12 3 10 5-10 5L2 8l10-5Zm-10 10 10 5 10-5M2 18l10 5 10-5"/></symbol>
 <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 18v3h16v-3"/></symbol>
 <symbol id="icon-spark" viewBox="0 0 24 24"><path d="m12 2 2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></symbol>
 <symbol id="icon-filter" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8L3 5Z"/></symbol>
 <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
 <symbol id="icon-bookmark" viewBox="0 0 24 24"><path d="M5 3h14v19l-7-5-7 5V3Z"/></symbol>
</svg>
<div id="app">
 <aside class="sidebar">
  <button class="brand" data-view="overview" aria-label="Screening Atlas 首頁">
   <img src="./assets/icon-192.png" class="brand-icon" alt=""/>
   <span class="brand-word">screening<span class="brand-subword">atlas<span class="brand-dot">.</span></span></span>
  </button>
  <div class="side-kicker">WORKSPACE <span>01</span></div>
  <nav class="side-nav" aria-label="主要導覽">
   <button data-view="overview" class="nav-link selected"><svg><use href="#icon-grid"/></svg>總覽<span class="shortcut">G</span></button>
   <button data-view="screen" class="nav-link"><svg><use href="#icon-search"/></svg>工廠篩查<span class="shortcut">S</span></button>
   <button data-view="library" class="nav-link"><svg><use href="#icon-database"/></svg>合作資料庫</button>
   <button data-view="quality" class="nav-link"><svg><use href="#icon-shield"/></svg>資料健康度</button>
   <button data-view="updates" class="nav-link"><svg><use href="#icon-upload"/></svg>資料更新</button>
  </nav>
  <div class="sidebar-bottom">
   <div class="privacy-panel"><div class="privacy-symbol"><svg><use href="#icon-lock"/></svg></div><div><strong>Private by design</strong><span>資料只存在你的裝置</span></div></div>
   <div class="sidebar-footer"><span id="side-database">尚未匯入資料</span><span class="version-badge">v 1.0</span></div>
  </div>
 </aside>
 <div class="workspace">
  <header class="topbar"><div class="topbar-left"><div class="breadcrumb">YOUR WORKSPACE <span>/</span> <strong id="breadcrumb">總覽</strong></div></div><div class="topbar-actions"><span class="local-pill"><span class="local-indicator"></span> ON-DEVICE</span><button type="button" class="outline-btn top-import" data-action="pick-file"><svg><use href="#icon-upload"/></svg> 更新資料</button></div></header>
  <main class="main-content" id="main-content" tabindex="-1"></main>
 </div>
</div>
<nav class="mobile-nav" aria-label="手機導覽">
 <button data-view="overview" class="mobile-link selected"><svg><use href="#icon-grid"/></svg><span>總覽</span></button>
 <button data-view="screen" class="mobile-link"><svg><use href="#icon-search"/></svg><span>篩查</span></button>
 <button data-view="library" class="mobile-link"><svg><use href="#icon-database"/></svg><span>資料庫</span></button>
 <button data-view="quality" class="mobile-link"><svg><use href="#icon-shield"/></svg><span>檢查</span></button>
 <button data-view="updates" class="mobile-link"><svg><use href="#icon-upload"/></svg><span>更新</span></button>
</nav>
<input id="file-picker" type="file" accept=".xlsx,.xlsm,.json,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel.sheet.macroEnabled.12" hidden/>
<div id="drawer" class="drawer-backdrop" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="./js/app.js" type="module"></script>
</body>
</html>
